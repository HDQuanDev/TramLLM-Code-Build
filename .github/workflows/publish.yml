name: publish

# Công bố stable cho một bản đã có draft ở repo công khai này.
# Chạy tự động sau job draft của release.yml (workflow_call), hoặc chạy tay
# từ tab Actions khi draft đã có sẵn (workflow_dispatch). Chạy trên runner
# tự quản ở máy Mac vì cần khóa ký updater (~/.tauri/tramllm-code.key),
# AWS profile R2 và codesign — tất cả đều có sẵn trên máy bảo trì.
# Secret cần có ở repo này: TAURI_SIGNING_PRIVATE_KEY_PASSWORD (mật khẩu mở
# khóa ký; không bao giờ xuất hiện trong log hay trong chat).
on:
  workflow_call:
    inputs:
      tag:
        description: Stable version tag (vX.Y.Z) of the existing draft
        type: string
        required: true
    secrets:
      PRIVATE_REPO_TOKEN:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag (vX.Y.Z) of the existing draft
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish stable
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      TARGET_REPO: HDQuanDev/TramLLM-Code-Build
    steps:
      - uses: actions/checkout@v4
        with:
          repository: HDQuanDev/TramLLM-Code
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: refs/tags/${{ inputs.tag }}
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps (Tauri CLI for signing)
        run: npm ci
        working-directory: ui

      - name: Download draft assets
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPO" --dir dist

      - name: Point the publish script at this repo
        run: |
          sed -i '' "s|const repo = 'HDQuanDev/TramLLM-Code';|const repo = 'HDQuanDev/TramLLM-Code-Build';|" scripts/desktop-release.mjs
          git update-index --assume-unchanged scripts/desktop-release.mjs

      - name: Publish stable
        env:
          TRAM_ALLOW_UNSIGNED_MACOS: "1"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/desktop-release.mjs publish dist "$RELEASE_TAG"
